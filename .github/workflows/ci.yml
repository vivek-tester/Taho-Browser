name: CI

on:
  push:
    branches: ["main", "build/**"]
  pull_request:

jobs:
  pure-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Architecture gates
        run: gradle --no-daemon verifyArchitecture
      - name: Test pure modules
        run: >
          gradle --no-daemon
          :capture:domain:test
          :contract:taho-transfer:test
          :transfer:core:test

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Compile production browser and GeckoView spike
        run: >
          gradle --no-daemon
          :app:assembleDebug
          :spikes:geckoview:assembleDebug
          :spikes:geckoview:testDebugUnitTest
