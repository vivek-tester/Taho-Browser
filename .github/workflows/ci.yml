name: CI

on:
  push:
    branches: ["main", "build/**"]
  pull_request:

jobs:
  pure-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Architecture gates
        run: gradle --no-daemon verifyArchitecture
      - name: Test pure modules
        run: >
          gradle --no-daemon
          :capture:domain:test
          :contract:taho-transfer:test
          :transfer:core:test
          :test-support:http-fixtures:test
          :test-support:taho-receiver-harness:test
          :test-support:m4-slice:test

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 37 preview platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          PLATFORM_PACKAGE="platforms;android-37.2-beta3"
          echo "Installing pinned Android 17 platform package: $PLATFORM_PACKAGE"
          "$SDKMANAGER" --channel=3 "$PLATFORM_PACKAGE" "build-tools;36.0.0"

          PLATFORM_DIR="${PLATFORM_PACKAGE#platforms;}"
          if [ ! -e "$SDK_ROOT/platforms/android-37" ] &&
             [ -d "$SDK_ROOT/platforms/$PLATFORM_DIR" ]; then
            ln -s "$SDK_ROOT/platforms/$PLATFORM_DIR" "$SDK_ROOT/platforms/android-37"
          fi

          test -f "$SDK_ROOT/platforms/android-37/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Compile production browser and GeckoView spike
        run: >
          gradle --no-daemon
          :app:assembleDebug
          :spikes:geckoview:assembleDebug
          :spikes:geckoview:testDebugUnitTest
          :browser:runtime:testDebugUnitTest
          :browser:shell:testDebugUnitTest
          :browser:observation:testDebugUnitTest
          :capture:persist:testDebugUnitTest
          :transfer:android:assembleDebug

      - name: Verify committed Room schema is current
        shell: bash
        run: git diff --exit-code -- capture/persist/schemas

      - name: Upload M5 browser APK
        uses: actions/upload-artifact@v4
        with:
          name: taho-browser-m5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
